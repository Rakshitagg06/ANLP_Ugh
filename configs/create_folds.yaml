experiment:
  name: create-polar-folds
  model_type: m2
  fold: 0
  seed: 2026
  output_dir: outputs/runs

data:
  path: data/raw/eng_train.csv
  id_column: id
  text_column: text
  det_label_column: polarization
  fold_column: null
  type_label_columns:
    political: political
    racial_ethnic: racial/ethnic
    religious: religious
    gender_sexual_identity: gender/sexual
    other: other
  num_folds: 5
  internal_validation_fraction: 0.1
  max_length: 256
  type_metrics_on_gold_det_positive_only: true

model:
  pretrained_name: microsoft/deberta-v3-base
  revision: null
  dropout: 0.1
  lambda_type: 1.0

training:
  device: auto
  epochs: 1
  batch_size: 8
  eval_batch_size: 16
  gradient_accumulation_steps: 1
  learning_rate: 0.00002
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  early_stopping_patience: 1
  selection_metric: type_macro_f1
  mixed_precision: false
  deterministic: true
  num_workers: 0
  use_type_positive_weights: false

thresholds:
  default_det: 0.5
  default_type: 0.5
  det_grid: [0.5]
  type_grid: [0.5]
  type_mode: per_label

logging:
  level: INFO
  wandb:
    enabled: false
    project: anlp-project
    entity: manavberiwal006-iiit-hyderabad
    mode: offline
    tags: [data, folds]
