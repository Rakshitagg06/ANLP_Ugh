[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polar-hierarchy"
version = "0.1.0"
description = "Hierarchy-constrained models for English online polarization detection"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "torch>=2.1,<3",
  "transformers>=4.44,<5",
  "pandas>=2.0,<3",
  "numpy>=1.24,<3",
  "scikit-learn>=1.3,<2",
  "PyYAML>=6,<7",
  "matplotlib>=3.7,<4",
  "safetensors>=0.4,<1",
  "sentencepiece>=0.2,<1",
  "iterative-stratification>=0.1.9,<1",
]

[project.optional-dependencies]
wandb = ["wandb>=0.17,<1"]
parquet = ["pyarrow>=14,<20"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
